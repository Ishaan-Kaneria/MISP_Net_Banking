name: Trigger auto deployment for hackout-26

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/hackout-26-AutoDeployTrigger-585a3414-a94d-468a-83a3-5837f2f5565f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HACKOUT26_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HACKOUT26_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HACKOUT26_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hackout.azurecr.io
          registryUsername: ${{ secrets.HACKOUT26_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HACKOUT26_REGISTRY_PASSWORD }}
          containerAppName: hackout-26
          resourceGroup: hackout-26
          imageToBuild: hackout.azurecr.io/hackout-26:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


