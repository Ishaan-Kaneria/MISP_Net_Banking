# Render Blueprint for the Arth-AI backend.
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo. Render
# reads this file automatically and provisions both resources below.
#
# After the first deploy:
#   1. Copy the web service's URL (https://arthai-backend-XXXX.onrender.com).
#   2. Set NEXT_PUBLIC_API_URL to that URL wherever the frontend is hosted.
#   3. Come back to this service's environment settings and set CORS_ORIGINS
#      to the frontend's exact URL (no trailing slash), then redeploy.
#   4. Optionally set GEMINI_API_KEY for live chatbot replies — the app runs
#      fine without it (falls back to the built-in canned responses).
#
# The free plan spins the service down after inactivity — the first request
# after a while will be slow (cold start) while it wakes back up. That's
# normal for a free-tier demo deployment, not a bug.
databases:
  - name: arthai-db
    plan: free
    databaseName: arthai
    user: arthai

services:
  - type: web
    name: arthai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arthai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MIN
        value: "720"
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
