services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arthai
      POSTGRES_PASSWORD: arthai
      POSTGRES_DB: arthai
    ports:
      - "5432:5432"
    volumes:
      - arthai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthai -d arthai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://arthai:arthai@db:5432/arthai
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  arthai_pgdata:
